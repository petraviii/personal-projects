name: paper-trading-ml CI

on:
  push:
    paths:
      - 'paper-trading-ml/**'
      - '.github/workflows/paper-trading-ml-ci.yml'
  pull_request:
    paths:
      - 'paper-trading-ml/**'
      - '.github/workflows/paper-trading-ml-ci.yml'

defaults:
  run:
    working-directory: paper-trading-ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
